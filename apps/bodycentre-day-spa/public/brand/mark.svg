<svg xmlns="http://www.w3.org/2000/svg" viewBox="270 58 704 704" role="img" aria-label="BodyCentre">
<!-- Hand-drawn in the coordinates of brand/logo-original.png (1254 x 911). Keep in sync with logo.svg. -->
<defs>
  <!-- B: Trajan-style, its lower bowl wider than the upper. -->
  <path id="bc-b" fill-rule="evenodd" d="
    M 377 187 L 560 187 C 615 187 643 215 643 252 C 643 290 618 312 590 322
    C 640 332 683 370 683 420 C 683 474 645 508 590 510 L 377 510 L 377 503
    C 392 502 400 498 400 488 L 400 209 C 400 199 392 195 377 194 Z
    M 445 207 L 555 207 C 582 207 600 230 600 260 C 600 295 578 317 548 317 L 445 317 Z
    M 445 340 L 560 340 C 615 340 645 375 645 420 C 645 465 610 490 560 492 L 445 492 Z"/>
  <!-- C: outer circle (672, 515) r 182, counter an ellipse set right so the stress sits at the left;
       the top arm sweeps out to its terminal, and the tail turns up into the vine. -->
  <path id="bc-c" d="
    M 660 333.4 C 735 330 800 352 840 392 C 846 398 838 407 829 405
    C 800 368 740 349 672 348 A 160 166.5 0 1 0 782 650
    C 798 636 814 625 834 617 L 837 624 C 826 634 809 637 800.7 643.7
    A 182 182 0 1 1 660 333.4 Z"/>
  <!-- The tail runs on into the small leaf; the tall leaf rises on its own stem from the tail. -->
  <path id="bc-leaves" d="
    M 793 641 C 797 628 800 614 800 598 L 805 598 C 806 614 804 630 801 638 Z
    M 803 600 C 780 590 714 550 718 480 C 722 440 732 410 739 387
    C 760 420 815 465 830 505 C 840 545 826 582 803 600 Z
    M 824 624 C 840 610 852 568 885 546 C 898 540 910 535 918 532
    C 914 560 900 600 872 618 C 858 627 840 630 826 628 Z"/>
  <!-- Interlace: the B passes over the C at the top crossing, the C over the B's foot. -->
  <clipPath id="bc-top"><rect width="1254" height="420"/></clipPath>
  <clipPath id="bc-bottom"><rect y="420" width="1254" height="491"/></clipPath>
  <mask id="bc-c-under" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="911">
    <rect width="1254" height="911" fill="#fff"/>
    <use href="#bc-b" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round" clip-path="url(#bc-top)"/>
  </mask>
  <mask id="bc-b-under" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="911">
    <rect width="1254" height="911" fill="#fff"/>
    <use href="#bc-c" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round" clip-path="url(#bc-bottom)"/>
  </mask>
  <mask id="bc-ribs" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="911">
    <rect width="1254" height="911" fill="#fff"/>
    <path d="M 799 600 C 785 540 762 460 742 396 M 836 618 C 860 595 888 562 910 539" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  </mask>
</defs>
<g fill="#28364a">
  <!-- Ring (622, 410) r 346, open at the bottom, each end tapering to a point. -->
  <path d="M 560 750.4 A 346 346 0 1 1 684 750.4 Q 711.6 744.2 737.3 726.7 A 337 337 0 1 0 506.7 726.7 Q 532.4 744.2 560 750.4 Z"/>
  <use href="#bc-b" mask="url(#bc-b-under)"/>
  <use href="#bc-c" mask="url(#bc-c-under)"/>
  <use href="#bc-leaves" mask="url(#bc-ribs)"/>
</g>
</svg>
