name: Setup
description: Bun (version from package.json) and a fresh install. Turbo remote cache comes from job env.
# No actions/cache for ~/.bun/install/cache: restoring its ~650 MB took 21 to 29 s per job,
# while a fresh `bun install --frozen-lockfile` from the registry takes 10 to 15 s (PR #57).
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
